<body>
  <a class="skip-link" href="#table">پرش به جدول</a>

  <header class="site-header">
    <div class="brand">
      <img src="assets/img/logo.png" alt="" width="36" height="36" />
      <div>
        <h1 class="brand__title">جدول تناوبی عناصر</h1>
        <p class="brand__subtitle">۱۱۸ عنصر شیمیایی · برای دیدن جزئیات روی عنصر کلیک کنید</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <label class="visually-hidden" for="search">جستجوی عنصر</label>
        <input id="search" type="search" placeholder="جستجو: نام، نماد یا عدد اتمی (/)" autocomplete="off"

      </div>
      <button id="reset" class="button" type="button" hidden>پاک‌کردن فیلترها</button>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="تغییر پوسته"></button>
    </div>
  </header>

  <main class="page">
    <section aria-label="دسته‌بندی عناصر">
      <ul id="legend" class="legend"></ul>
    </section>

    <section class="table-scroller" dir="ltr" aria-label="جدول تناوبی">
      <div id="table" class="periodic-table" dir="ltr" role="group">
        <aside id="preview" class="preview" aria-live="polite">
          <div class="preview__info">
            <strong>جدول تناوبی عناصر</strong>
            <span>نشانگر را روی یک عنصر ببرید تا خلاصهٔ آن اینجا نمایش داده شود.</span>
          </div>
        </aside>
      </div>
      <noscript>
        <p class="noscript">برای نمایش جدول تناوبی، جاوااسکریپت باید فعال باشد.</p>
      </noscript>
    </section>
  </main>


  <dialog id="detail" class="detail-dialog" aria-labelledby="detail-title" tabindex="-1">
